<!doctype html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>1C Merge Report Viewer</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
<div id="appShell" class="container-fluid p-3">
  <div class="d-flex flex-wrap gap-2 align-items-center mb-3">
    <h1 class="h4 m-0 me-auto">1C Merge Report Viewer</h1>
    <input id="fileInput" type="file" class="form-control form-control-sm w-auto" accept=".txt" />
  </div>

  <div id="mainRow" class="row g-3">
    <aside class="col-12 col-lg-4 col-xl-3 d-flex">
      <div class="card h-100 w-100">
        <div class="card-body d-flex flex-column gap-2 sidebar-body">
          <input id="searchInput" class="form-control form-control-sm" placeholder="Поиск: объект, группа, текст diff" />
          <select id="groupFilter" class="form-select form-select-sm">
            <option value="all">Все типы объектов</option>
          </select>
          <select id="typeFilter" class="form-select form-select-sm">
            <option value="all">Все типы изменений</option>
            <option value="changed">Изменено</option>
            <option value="mainOnly">Только в основной</option>
            <option value="fileOnly">Только в файле</option>
            <option value="meta">Мета-изменения (параметры)</option>
          </select>
          <select id="riskFilter" class="form-select form-select-sm">
            <option value="all">Любой риск</option>
            <option value="high">Высокий</option>
            <option value="medium">Средний</option>
            <option value="low">Низкий</option>
          </select>
          <div class="form-check form-switch mb-1">
            <input class="form-check-input" type="checkbox" id="hideMainOnlyToggle">
            <label class="form-check-label small" for="hideMainOnlyToggle">Не учитывать "только в основной конфигурации"</label>
          </div>
          <select id="sortBy" class="form-select form-select-sm">
            <option value="countDesc">Сортировка: больше конфликтов</option>
            <option value="countAsc">Сортировка: меньше конфликтов</option>
            <option value="nameAsc">Сортировка: имя (А-Я)</option>
          </select>
          <div id="summary" class="small text-secondary">Загрузите отчёт.</div>
          <div id="treeList" class="flex-grow-1"></div>
        </div>
      </div>
    </aside>

    <main class="col-12 col-lg-8 col-xl-9 d-flex">
      <div class="card h-100 w-100">
        <div class="card-body details-body">
          <div id="detailsScroll">
            <div id="detailsPlaceholder" class="text-secondary">Выберите группу/объект, чтобы увидеть конфликты.</div>
            <div id="details"></div>
          </div>
        </div>
      </div>
    </main>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
